name: Test
on:
    pull_request:
        paths-ignore:
            - '**.md'
            - 'readme.txt'
    push:
        branches: [master]
        paths-ignore:
            - '**.md'
            - 'readme.txt'

jobs:
    wp-versions:
        name: Resolve WP versions
        runs-on: ubuntu-latest
        permissions: {}
        outputs:
            matrix: ${{ steps.resolve.outputs.matrix }}
        steps:
            - id: resolve
              name: Resolve the latest 3 WordPress branches from the WordPress.org API
              run: |
                  json=$(curl -sf https://api.wordpress.org/core/stable-check/1.0/)
                  latest=$(echo "$json" | jq -r 'to_entries[] | select(.value=="latest") | .key')
                  latest_mm=$(echo "$latest" | grep -oE '^[0-9]+\.[0-9]+')
                  branches=$(echo "$json" | jq -r 'keys[]' | grep -oE '^[0-9]+\.[0-9]+' | sort -uV | grep -x -B2 "$latest_mm")
                  if [ -z "$latest" ] || [ "$(echo "$branches" | wc -l)" -ne 3 ]; then
                    echo "::error::Failed to resolve WP versions (latest=$latest branches=$branches)"; exit 1
                  fi
                  matrix=$(echo "$branches" | jq -Rnc '[inputs] | reverse + ["trunk"]')
                  echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
                  echo "Resolved: $matrix"

    phpunit:
        needs: wp-versions
        name: PHPUnit (WordPress ${{ matrix.wp }}, PHP ${{ matrix.php }})
        runs-on: ubuntu-latest
        permissions:
            contents: read
        # Trunk is a moving target; report its failures without failing the workflow.
        continue-on-error: ${{ matrix.wp == 'trunk' }}
        strategy:
            fail-fast: false
            matrix:
                wp: ${{ fromJSON(needs.wp-versions.outputs.matrix) }}
                php: ['7.4', '8.5']
        env:
            WP_ENV_CORE: WordPress/WordPress#${{ matrix.wp == 'trunk' && 'master' || format('{0}-branch', matrix.wp) }}
            WP_ENV_PHP_VERSION: ${{ matrix.php }}
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .node-version
                  cache: npm

            # Blocks malicious npm packages: npm and npx run through Aikido Safe Chain from here on.
            - name: Install Aikido Safe Chain
              run: |
                  curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.27/install-safe-chain.sh -o /tmp/install-safe-chain.sh
                  echo "600ebddcb3aaf1fd53653a8d7985df44528722c0f5ee7eb9fff86f26a1a4e5a8  /tmp/install-safe-chain.sh" | sha256sum -c -
                  sh /tmp/install-safe-chain.sh --ci
                  rm /tmp/install-safe-chain.sh

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  tools: composer

            - name: Install Node dependencies
              run: npm ci

            - name: Install Composer dependencies
              run: composer install --no-progress --no-interaction

            - name: Run PHPUnit
              run: npm run test:php
